<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Borang WhatsApp</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: linear-gradient(to right, #4facfe, #00f2fe); 
            color: white;
        }
        input, button { 
            margin: 10px; 
            padding: 8px; 
            width: 80%; 
            max-width: 400px; 
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #0288d1;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0277bd;
        }
        h1 {
            font-size: 32px;
            font-weight: bold;
        }
        footer { 
            margin-top: 20px; 
            font-size: 14px; 
            color: white; 
        }
    </style>
</head>
<body>
    <h1>Setup Borang WhatsApp</h1>
    <h2>Masukkan Maklumat Borang</h2>
    <input type="tel" id="phone" placeholder="Masukkan No Telefon Anda (60123456789)" required>
    <input type="text" id="formTitle" placeholder="Tajuk Borang (Contoh: Tempahan Makanan)" required>
    <button onclick="createForm()">Cipta Borang</button>
    
    <script>
        function createForm() {
            let phone = document.getElementById("phone").value.trim();
            let formTitle = document.getElementById("formTitle").value.trim();
            if (phone === "" || formTitle === "") {
                alert("Sila masukkan semua maklumat!");
                return;
            }
            window.location.href = `form.html?phone=${phone}&title=${encodeURIComponent(formTitle)}`;
        }
    </script>
    
    <footer>
        &copy; 2025 Mr.Syah | WhatsApp Form
    </footer>
</body>
</html>
