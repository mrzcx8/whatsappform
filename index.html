<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Form Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }
        input, button {
            margin: 10px;
            padding: 8px;
            width: 80%;
            max-width: 400px;
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #0288d1;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0277bd;
        }
        #linkSection {
            display: none;
            margin-top: 20px;
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>WhatsApp Form Generator</h1>
    <p>Masukkan nombor telefon dan tajuk borang anda.</p>
    <input type="text" id="phoneNumber" placeholder="Masukkan Nombor Telefon" required>
    <input type="text" id="formTitle" placeholder="Masukkan Tajuk Borang" required>
    <button onclick="generateLink()">Cipta Borang</button>
    
    <div id="linkSection">
        <p>Pautan Borang Anda:</p>
        <input type="text" id="generatedLink" readonly>
        <button onclick="copyLink()">Salin Pautan</button>
    </div>
    
    <script>
        function generateLink() {
            let phone = document.getElementById("phoneNumber").value.trim();
            let title = encodeURIComponent(document.getElementById("formTitle").value.trim());
            if (phone === "" || title === "") {
                alert("Sila isi semua maklumat!");
                return;
            }
            let link = `form.html?phone=${phone}&title=${title}`;
            document.getElementById("generatedLink").value = link;
            document.getElementById("linkSection").style.display = "block";
        }

        function copyLink() {
            let copyText = document.getElementById("generatedLink");
            copyText.select();
            document.execCommand("copy");
            alert("Pautan telah disalin!");
        }
    </script>
    
    <footer>
        &copy; 2025 Mr.Syah | WhatsApp Form
    </footer>
</body>
</html>
