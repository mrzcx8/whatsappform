<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Custom Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #33ccff, #0099ff);
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>WhatsApp Custom Form</h2>
        <label for="formType">Pilih Jenis Borang:</label>
        <select id="formType" onchange="updateForm()">
            <option value="">-- Pilih --</option>
            <option value="register">Register</option>
            <option value="tempahan">Tempahan</option>
            <option value="travel_booking">Travel Booking</option>
            <option value="food_order">Food Order</option>
            <option value="register_kursus">Register Kursus</option>
            <option value="lain">Lain-lain</option>
        </select>

        <form id="dynamicForm">
            <div id="formFields"></div>
            <button type="button" onclick="sendToWhatsApp()">Hantar ke WhatsApp</button>
        </form>

        <p>© 2025 Mr.Syah | WhatsApp Form</p>
    </div>

    <script>
        let phoneNumber = "";

        // Ambil nombor telefon dari URL
        function getPhoneFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            phoneNumber = urlParams.get("phone") || "";
        }

        function updateForm() {
            let formType = document.getElementById("formType").value;
            let formFields = document.getElementById("formFields");
            formFields.innerHTML = "";

            let fields = [];

            if (formType === "register") {
                fields = [
                    { id: "name", placeholder: "Nama Penuh" },
                    { id: "email", placeholder: "Email" },
                    { id: "phone_number", placeholder: "No. Telefon" }
                ];
            } else if (formType === "tempahan") {
                fields = [
                    { id: "product", placeholder: "Nama Produk" },
                    { id: "quantity", placeholder: "Kuantiti" },
                    { id: "price", placeholder: "Harga" }
                ];
            } else if (formType === "travel_booking") {
                fields = [
                    { id: "destination", placeholder: "Destinasi" },
                    { id: "date", placeholder: "Tarikh Perjalanan" },
                    { id: "passengers", placeholder: "Bilangan Penumpang" }
                ];
            } else if (formType === "food_order") {
                fields = [
                    { id: "food_item", placeholder: "Nama Makanan" },
                    { id: "quantity", placeholder: "Kuantiti" },
                    { id: "delivery_address", placeholder: "Alamat Penghantaran" }
                ];
            } else if (formType === "register_kursus") {
                fields = [
                    { id: "kursus_name", placeholder: "Nama Kursus" },
                    { id: "participant_name", placeholder: "Nama Peserta" },
                    { id: "contact", placeholder: "No. Telefon" }
                ];
            } else if (formType === "lain") {
                fields = [
                    { id: "custom_info", placeholder: "Maklumat Tambahan" }
                ];
            }

            fields.forEach(field => {
                let input = document.createElement("input");
                input.type = "text";
                input.id = field.id;
                input.placeholder = field.placeholder;
                formFields.appendChild(input);
            });
        }

        function sendToWhatsApp() {
            let formType = document.getElementById("formType").value;
            let inputs = document.querySelectorAll("#formFields input");
            let message = `${formType.toUpperCase()}:\n`;

            if (!formType) {
                alert("Sila pilih jenis borang dahulu!");
                return;
            }

            if (!phoneNumber) {
                alert("Nombor WhatsApp penerima tidak ditetapkan!");
                return;
            }

            inputs.forEach(input => {
                if (input.value.trim() !== "") {
                    message += `- ${input.placeholder}: ${input.value.trim()}\n`;
                }
            });

            let waLink = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(message)}`;
            window.open(waLink, "_blank");
        }

        // Panggil fungsi untuk ambil nombor telefon dari URL
        getPhoneFromURL();
    </script>

</body>
</html>
