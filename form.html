<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Custom Form</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: linear-gradient(to right, #4facfe, #00f2fe); 
            color: white;
        }
        input, button, select { 
            margin: 10px; 
            padding: 10px; 
            width: 80%; 
            max-width: 400px; 
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #005cbf;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #004494;
        }
        h1 {
            font-size: 32px;
            font-weight: bold;
        }
        #extraFields {
            margin-top: 10px;
        }
        .note {
            font-size: 14px;
            color: #fff;
            margin-top: 20px;
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: white;
        }
    </style>
</head>
<body>
    <h1 id="formTitle">Borang</h1>
    <p>ID Bil: <span id="billNumber"></span></p>

    <select id="formType" onchange="loadForm()">
        <option value="">Pilih Jenis Borang</option>
        <option value="Register">Register</option>
        <option value="Tempahan">Tempahan</option>
        <option value="Travel Booking">Travel Booking</option>
        <option value="Food Order">Food Order</option>
        <option value="Register Kursus">Register Kursus</option>
        <option value="Lain-lain">Lain-lain</option>
    </select>

    <div id="dynamicForm"></div>

    <button onclick="addField()">Nota Tambahan</button>
    <button onclick="sendToWhatsApp()">Hantar ke WhatsApp</button>

    <p class="note"><strong>Panduan Penggunaan:</strong><br>
        1. Pilih jenis borang dari dropdown.<br>
        2. Isikan maklumat berdasarkan borang yang dipilih.<br>
        3. Klik "Nota Tambahan" jika ingin menambah maklumat lain.<br>
        4. Tekan "Hantar ke WhatsApp" untuk menghantar borang.
    </p>

    <footer>
        &copy; 2025 Mr.Syah | WhatsApp Form
    </footer>

    <script>
        function createInputField(id, placeholder) {
            let input = document.createElement("input");
            input.type = "text";
            input.id = id;
            input.placeholder = placeholder;
            return input;
        }

        function loadForm() {
            let formType = document.getElementById("formType").value;
            let formContainer = document.getElementById("dynamicForm");
            formContainer.innerHTML = ""; // Kosongkan medan sebelumnya

            document.getElementById("formTitle").innerText = formType || "Borang";
            document.getElementById("billNumber").innerText = Math.floor(100000 + Math.random() * 900000);

            let fields = [];

            if (formType === "Register") {
                fields = [
                    createInputField("name", "Nama Penuh"),
                    createInputField("email", "Email"),
                    createInputField("phone", "No. Telefon")
                ];
            } else if (formType === "Tempahan") {
                fields = [
                    createInputField("customerName", "Nama Pelanggan"),
                    createInputField("orderDetails", "Butiran Tempahan"),
                    createInputField("date", "Tarikh Tempahan"),
                    createInputField("quantity", "Jumlah")
                ];
            } else if (formType === "Travel Booking") {
                fields = [
                    createInputField("travelerName", "Nama Penumpang"),
                    createInputField("destination", "Destinasi"),
                    createInputField("departureDate", "Tarikh Pergi"),
                    createInputField("returnDate", "Tarikh Balik"),
                    createInputField("numberOfPersons", "Bilangan Penumpang")
                ];
            } else if (formType === "Food Order") {
                fields = [
                    createInputField("customerName", "Nama Pelanggan"),
                    createInputField("foodItem", "Nama Makanan"),
                    createInputField("quantity", "Kuantiti"),
                    createInputField("specialRequest", "Permintaan Khas (Opsyenal)")
                ];
            } else if (formType === "Register Kursus") {
                fields = [
                    createInputField("studentName", "Nama Pelajar"),
                    createInputField("courseName", "Nama Kursus"),
                    createInputField("email", "Email"),
                    createInputField("phone", "No. Telefon")
                ];
            } else if (formType === "Lain-lain") {
                fields = [createInputField("generalInput", "Masukkan Maklumat")];
            }

            fields.forEach(field => formContainer.appendChild(field));
        }

        function addField() {
            let extraFields = document.getElementById("dynamicForm");
            let input = createInputField("", "Nota Tambahan");
            extraFields.appendChild(input);
        }

        function sendToWhatsApp() {
            let phone = "601112345678"; // Tukar ke nombor sebenar jika mahu
            let formType = document.getElementById("formType").value;
            let inputs = document.querySelectorAll("#dynamicForm input");
            let message = `${formType.toUpperCase()}:\n`;

            if (!formType) {
                alert("Sila pilih jenis borang dahulu!");
                return;
            }

            inputs.forEach(input => {
                if (input.value.trim() !== "") {
                    message += `- ${input.placeholder}: ${input.value.trim()}\n`;
                }
            });

            if (message.trim() === `${formType.toUpperCase()}:\n`) {
                alert("Sila isi sekurang-kurangnya satu maklumat sebelum menghantar!");
                return;
            }

            let waLink = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(waLink, "_blank");
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("billNumber").innerText = Math.floor(100000 + Math.random() * 900000);
        });
    </script>
</body>
</html>
