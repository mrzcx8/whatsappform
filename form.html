<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borang Pelanggan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
    }
    input, textarea {
      padding: 10px;
      margin: 10px;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      background-color: #25D366;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Borang Pelanggan</h1>
  <p>Sila isi maklumat anda:</p>
  <input type="text" id="name" placeholder="Nama">
  <input type="email" id="email" placeholder="Emel">
  <textarea id="message" placeholder="Mesej"></textarea>
  <button onclick="submitForm()">Hantar ke WhatsApp</button>

  <script>
    function submitForm() {
      // Ambil nombor telefon dari URL
      const urlParams = new URLSearchParams(window.location.search);
      const phoneNumber = urlParams.get('phone');

      if (!phoneNumber) {
        alert("Nombor telefon tidak sah!");
        return;
      }

      // Ambil maklumat borang
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !message) {
        alert("Sila lengkapkan semua medan!");
        return;
      }

      // Format pesanan untuk WhatsApp
      const whatsappMessage = `Nama: ${name}%0AEmel: ${email}%0AMesej: ${message}`;
      const whatsappLink = `https://wa.me/${phoneNumber}?text=${whatsappMessage}`;

      // Buka WhatsApp
      window.open(whatsappLink, '_blank');
    }
  </script>
</body>
</html>
