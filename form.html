<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang WhatsApp</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: linear-gradient(to right, #4facfe, #00f2fe); 
            color: white;
        }
        input, button { 
            margin: 10px; 
            padding: 8px; 
            width: 80%; 
            max-width: 400px; 
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #0288d1;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0277bd;
        }
        h1 {
            font-size: 32px;
            font-weight: bold;
        }
        footer { 
            margin-top: 20px; 
            font-size: 14px; 
            color: white; 
        }
    </style>
</head>
<body>
    <h1>Borang WhatsApp</h1>
    <h2>Borang Custom Anda</h2>
    <input type="text" id="customerName" placeholder="Nama Pelanggan" required>
    <input type="text" id="orderDetails" placeholder="Detail Pesanan" required>
    <button onclick="sendToWhatsApp()">Hantar ke WhatsApp</button>
    
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function sendToWhatsApp() {
            let phone = getQueryParam("phone");
            let customerName = document.getElementById("customerName").value.trim();
            let orderDetails = document.getElementById("orderDetails").value.trim();
            
            if (!phone) {
                alert("Nombor telefon tidak dijumpai!");
                return;
            }
            if (customerName === "" || orderDetails === "") {
                alert("Sila isi semua maklumat!");
                return;
            }
            
            let message = `Nama: ${customerName}%0AOrder: ${orderDetails}`;
            let url = `https://wa.me/${phone}?text=${message}`;
            window.open(url, "_blank");
        }
    </script>
    
    <footer>
        &copy; 2025 Mr.Syah | WhatsApp Form
    </footer>
</body>
</html>
