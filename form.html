<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Custom Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #38b6ff, #0072ff);
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 50px auto;
        }
        select, input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #0072ff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005ecb;
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="formTitle">WhatsApp Custom Form</h2>
        <label>Pilih Jenis Borang:</label>
        <select id="formType">
            <option value="">-- Pilih --</option>
            <option value="REGISTER">Pendaftaran</option>
            <option value="TEMPAHAN">Tempahan</option>
            <option value="TRAVEL BOOKING">Tempahan Perjalanan</option>
            <option value="FOOD ORDER">Pesanan Makanan</option>
            <option value="REGISTER KURSUS">Pendaftaran Kursus</option>
            <option value="PERTANYAAN">Pertanyaan</option>
            <option value="LAIN-LAIN">Lain-lain</option>
        </select>
        
        <div id="formFields"></div>

        <button onclick="sendToWhatsApp()">Hantar ke WhatsApp</button>
    </div>

    <footer>
        © 2025 Mr.Syah | WhatsApp Form
    </footer>

    <script>
        let phoneNumber = "";
        let formTitle = "WhatsApp Custom Form";
        let billId = "";

        // Fungsi untuk menjana Bill ID secara rawak
        function generateBillId() {
            return "BILL-" + Math.floor(100000 + Math.random() * 900000);
        }

        // Ambil data dari URL
        function getParamsFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            phoneNumber = urlParams.get("phone") || "";
            formTitle = decodeURIComponent(urlParams.get("title") || "WhatsApp Custom Form");
            billId = urlParams.get("billid") || generateBillId(); // Auto-generate jika tiada dalam URL

            document.getElementById("formTitle").innerText = formTitle;
        }

        // Tukar borang ikut pilihan pengguna
        document.getElementById("formType").addEventListener("change", function () {
            let formFields = document.getElementById("formFields");
            formFields.innerHTML = "";

            let formType = this.value;

            if (formType === "REGISTER") {
                formFields.innerHTML = `
                    <input type="text" placeholder="Nama Penuh" id="nama">
                    <input type="email" placeholder="Email" id="email">
                    <input type="tel" placeholder="No. Telefon" id="phone">
                `;
            } else if (formType === "TEMPAHAN") {
                formFields.innerHTML = `
                    <input type="text" placeholder="Nama Produk" id="produk">
                    <input type="number" placeholder="Kuantiti" id="kuantiti">
                    <input type="text" placeholder="Harga (RM)" id="harga">
                `;
            } else if (formType === "TRAVEL BOOKING") {
                formFields.innerHTML = `
                    <input type="text" placeholder="Destinasi" id="destinasi">
                    <input type="date" placeholder="Tarikh Berlepas" id="tarikh">
                    <input type="number" placeholder="Bilangan Penumpang" id="penumpang">
                `;
            } else if (formType === "FOOD ORDER") {
                formFields.innerHTML = `
                    <input type="text" placeholder="Nama Makanan" id="makanan">
                    <input type="number" placeholder="Kuantiti" id="kuantiti">
                    <input type="text" placeholder="Alamat Penghantaran" id="alamat">
                `;
            } else if (formType === "REGISTER KURSUS") {
                formFields.innerHTML = `
                    <input type="text" placeholder="Nama Kursus" id="kursus">
                    <input type="text" placeholder="Nama Penuh" id="nama">
                    <input type="email" placeholder="Email" id="email">
                `;
            } else if (formType === "PERTANYAAN") {
                formFields.innerHTML = `
                    <input type="text" placeholder="Nama Anda" id="nama">
                    <input type="email" placeholder="Email" id="email">
                    <textarea placeholder="Pertanyaan Anda" id="pertanyaan"></textarea>
                `;
            } else if (formType === "LAIN-LAIN") {
                formFields.innerHTML = `
                    <textarea placeholder="Maklumat lain-lain" id="lain"></textarea>
                `;
            }
        });

        function sendToWhatsApp() {
            let formType = document.getElementById("formType").value;
            let inputs = document.querySelectorAll("#formFields input, #formFields textarea");
            let message = `📌 *${formTitle}*\n🆔 Bill ID: ${billId}\n\n${formType.toUpperCase()}:\n`;

            if (!formType) {
                alert("Sila pilih jenis borang dahulu!");
                return;
            }

            if (!phoneNumber) {
                alert("Nombor WhatsApp penerima tidak ditetapkan!");
                return;
            }

            inputs.forEach(input => {
                if (input.value.trim() !== "") {
                    message += `- ${input.placeholder}: ${input.value.trim()}\n`;
                }
            });

            let waLink = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(message)}`;
            window.open(waLink, "_blank");
        }

        // Panggil fungsi untuk ambil data dari URL
        getParamsFromURL();
    </script>

</body>
</html>
