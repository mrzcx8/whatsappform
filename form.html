<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang WhatsApp</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: linear-gradient(to right, #4facfe, #00f2fe); 
            color: white;
        }
        input, button { 
            margin: 10px; 
            padding: 8px; 
            width: 80%; 
            max-width: 400px; 
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #0288d1;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0277bd;
        }
        h1 {
            font-size: 32px;
            font-weight: bold;
        }
        .extra-field {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .extra-field input {
            width: 70%;
        }
        footer { 
            margin-top: 20px; 
            font-size: 14px; 
            color: white; 
        }
    </style>
</head>
<body>
    <h1>Borang WhatsApp</h1>
    <h2 id="formTitle">Borang Custom Anda</h2>
    <input type="text" id="customerName" placeholder="Nama Pelanggan" required>
    <input type="text" id="orderDetails" placeholder="Detail Pesanan" required>
    
    <h3>Maklumat Tambahan (Opsyenal)</h3>
    <input type="email" id="email" placeholder="Email (Opsyenal)">
    <input type="tel" id="phoneNumber" placeholder="No Telefon (Opsyenal)">
    <input type="text" id="address" placeholder="Alamat (Opsyenal)">

    <h3>ID Bil</h3>
    <input type="text" id="billId" readonly>

    <div id="extraFields"></div>
    <button onclick="addField()">Tambah Medan</button>
    <button onclick="sendToWhatsApp()">Hantar ke WhatsApp</button>
    
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function generateBillId() {
            return 'BIL' + Math.floor(100000 + Math.random() * 900000);
        }

        function addField() {
            let extraFields = document.getElementById("extraFields");
            let div = document.createElement("div");
            div.classList.add("extra-field");
            let input = document.createElement("input");
            input.type = "text";
            input.placeholder = "Maklumat tambahan";
            div.appendChild(input);
            extraFields.appendChild(div);
        }

        function sendToWhatsApp() {
            let phone = getQueryParam("phone");
            let customerName = document.getElementById("customerName").value.trim();
            let orderDetails = document.getElementById("orderDetails").value.trim();
            let billId = document.getElementById("billId").value.trim();
            let email = document.getElementById("email").value.trim();
            let phoneNumber = document.getElementById("phoneNumber").value.trim();
            let address = document.getElementById("address").value.trim();
            
            if (!phone) {
                alert("Nombor telefon tidak dijumpai!");
                return;
            }
            if (customerName === "" || orderDetails === "") {
                alert("Sila isi semua maklumat!");
                return;
            }
            
            let message = `Nama: ${customerName}%0AOrder: ${orderDetails}%0AID Bil: ${billId}`;
            
            if (email) message += `%0AEmail: ${email}`;
            if (phoneNumber) message += `%0ANo Telefon: ${phoneNumber}`;
            if (address) message += `%0AAlamat: ${address}`;

            document.querySelectorAll("#extraFields input").forEach(input => {
                if (input.value.trim() !== "") {
                    message += `%0A${input.value.trim()}`;
                }
            });
            
            let url = `https://wa.me/${phone}?text=${message}`;
            window.open(url, "_blank");
        }

        window.onload = function() {
            let formTitle = getQueryParam("title");
            if (formTitle) {
                document.getElementById("formTitle").innerText = formTitle;
                document.getElementById("orderDetails").placeholder = formTitle;
            }
            document.getElementById("billId").value = generateBillId();
        };
    </script>
    
    <footer>
        &copy; 2025 Mr.Syah | WhatsApp Form
    </footer>
</body>
</html>
