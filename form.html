<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Custom Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }
        input, button {
            margin: 10px;
            padding: 8px;
            width: 80%;
            max-width: 400px;
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #0288d1;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0277bd;
        }
        .extra-field {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .extra-field input {
            width: 70%;
        }
        #billId {
            font-size: 12px;
            margin-bottom: 10px;
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: white;
        }
    </style>
</head>
<body>
    <h1 id="formTitle">Borang WhatsApp</h1>
    <p id="billId">ID Bil: <span id="billNumber"></span></p>
    
    <input type="text" id="customerName" placeholder="Nama Pelanggan" required>
    <input type="text" id="orderDetails" placeholder="Detail Pesanan" required>
    
    <div id="extraFields"></div>
    <button onclick="addField()">Tambah Medan Tambahan</button>
    <button onclick="sendToWhatsApp()">Hantar ke WhatsApp</button>
    
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function addField() {
            let extraFields = document.getElementById("extraFields");
            let div = document.createElement("div");
            div.classList.add("extra-field");
            let input = document.createElement("input");
            input.type = "text";
            input.placeholder = "Maklumat tambahan";
            div.appendChild(input);
            extraFields.appendChild(div);
        }

        function sendToWhatsApp() {
            let phone = getQueryParam("phone");
            let formTitle = getQueryParam("title");
            let customerName = document.getElementById("customerName").value.trim();
            let orderDetails = document.getElementById("orderDetails").value.trim();
            
            if (!phone) {
                alert("Nombor telefon tidak dijumpai!");
                return;
            }
            if (customerName === "" || orderDetails === "") {
                alert("Sila isi semua maklumat!");
                return;
            }
            
            let message = `Nama: ${customerName}%0AOrder: ${orderDetails}`;
            
            document.querySelectorAll("#extraFields input").forEach(input => {
                if (input.value.trim() !== "") {
                    message += `%0A${input.value.trim()}`;
                }
            });
            
            let url = `https://wa.me/${phone}?text=${message}`;
            window.open(url, "_blank");
        }

        document.getElementById("formTitle").textContent = getQueryParam("title") || "Borang WhatsApp";
        document.getElementById("billNumber").textContent = Math.floor(Math.random() * 1000000);
    </script>
    
    <footer>
        &copy; 2025 Mr.Syah | WhatsApp Form
    </footer>
</body>
</html>
